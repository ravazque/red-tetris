name: red-tetris

services:
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: prod
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: 3000
      LAN_HOST: ${LAN_HOST:-}
    ports:
      - "${PORT:?PORT must be set in .env}:3000"
    volumes:
      - ../certs:/certs:ro
    restart: unless-stopped
